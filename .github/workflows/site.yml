# Publica o site (site/, Astro) na raiz do GitHub Pages:
#   https://henriquecoan-code.github.io/farmacia/
# Requer, uma única vez: Settings -> Pages -> Source = "GitHub Actions".
# Com o domínio .com.br: trocar SITE_URL pelo domínio e BASE_PATH por "/" (e configurar o domínio no Pages).
name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'config/**'
      - '.github/workflows/site.yml'
  # O sync do ERP avisa quando o catálogo muda (site/scripts/sync-erp.mjs -> dispararBuild)
  repository_dispatch:
    types: [catalogo-atualizado]
  # Fotos novas são gravadas pelo bot (esse push não dispara workflows), então publica ao terminar
  workflow_run:
    workflows: ['Fotos de produtos']
    types: [completed]
  # Rede de segurança: todo dia às 03:30 (Brasília), para preços e produtos nunca ficarem velhos
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a mais nova espera a atual terminar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        working-directory: site
        run: npm ci --onnxruntime-node-install-cuda=skip

      # Garante que as regras do banco (RLS, criar_pedido) continuam valendo antes de publicar
      - name: Testes do banco
        working-directory: site
        run: npm run test:db

      # Lê os produtos do Supabase. Se o Supabase não responder, o build falha e o site publicado não muda.
      - name: Gerar o site
        working-directory: site
        env:
          SITE_URL: https://henriquecoan-code.github.io
          BASE_PATH: /farmacia
          # Endereço e chave pública do Supabase (a mesma que vai no navegador; não é segredo)
          PUBLIC_SUPABASE_URL: https://ytcqzpasqydnbhxmrkrc.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ioyB0TpE0wC5K6pILX8g0w_qd9c6arD
        run: npm run build

      - name: Conferir o que foi gerado
        run: |
          test -f site/dist/index.html
          test -d site/dist/pagefind
          paginas=$(find site/dist/produto -name index.html | wc -l)
          echo "Páginas de produto: $paginas"
          if [ "$paginas" -lt 500 ]; then echo "Catálogo pequeno demais ($paginas produtos): não publica."; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Avisa o healthchecks.io se a publicação deu certo ou falhou (painel único das automações).
  # Opcional: só avisa se existir o secret HEALTHCHECK_SITE (Settings -> Secrets and variables -> Actions).
  avisar:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Avisar o healthchecks.io
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_SITE }}
          RESULTADO: build=${{ needs.build.result }} deploy=${{ needs.deploy.result }} evento=${{ github.event_name }}
        run: |
          if [ -z "$HC_URL" ]; then echo "Sem HEALTHCHECK_SITE: nada a avisar."; exit 0; fi
          sufixo=""
          if [ "${{ needs.deploy.result }}" != "success" ]; then sufixo="/fail"; fi
          curl -fsS -m 15 --retry 3 --data-raw "$RESULTADO" "${HC_URL%/}$sufixo" > /dev/null || echo "Aviso não entregue."
